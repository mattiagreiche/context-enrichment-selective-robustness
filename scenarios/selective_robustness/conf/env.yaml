      params: {}
    action_prompt:
      built_in: null
      class_path: selective_robustness.silisocs_components.HospitalActionPrompt
      params: {}
    observe:
      built_in: null
      class_path: selective_robustness.silisocs_components.HospitalObservation
      params: {}
    resolve:
      built_in: null
      class_path: selective_robustness.silisocs_components.HospitalResolve
      params: {}
    update:
      built_in: null
      class_path: selective_robustness.silisocs_components.HospitalUpdate
      params: {}
